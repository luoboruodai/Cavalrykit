[package]
name = "cavalrykit"
version = "0.1.1"
edition = "2021"
description = "Cavalry 脚本/插件快捷安装器（macOS + Windows）"

[dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
rfd = "0.15"
env_logger = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
trash = "5"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
tar = "0.4.46"
flate2 = "1.1.10"
bzip2 = "0.6.1"
sevenz-rust = "0.6.1"

tempfile = "3"
pollster = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell"] }

[build-dependencies]
winres = { package = "tauri-winres", version = "0.3" }

[profile.release]
opt-level = 2
lto = true
