[package]
name = "cavalrykit"
version = "0.1.0"
edition = "2021"
description = "Cavalry 脚本/插件快捷安装器（macOS + Windows）"

[dependencies]
eframe = "0.31"
egui = "0.31"
rfd = "0.15"
env_logger = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
trash = "5"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
tar = "0.4.46"
flate2 = "1.1.10"
bzip2 = "0.6.1"
sevenz-rust = "0.6.1"

[profile.release]
opt-level = 2
lto = true
