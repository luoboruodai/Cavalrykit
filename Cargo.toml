[package]
name = "cavalrykit"
version = "0.1.1"
edition = "2021"
description = "Cavalry 脚本/插件快捷安装器（macOS + Windows）"

[features]
ui-preview = []

[[example]]
name = "ui_preview"
required-features = ["ui-preview"]

[dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
rfd = "0.15"
env_logger = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
trash = "5"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
tar = "0.4.46"
flate2 = "1.1.10"
bzip2 = "0.6.1"
sevenz-rust = "0.6.1"

tempfile = "3"
pollster = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSURL"] }

[build-dependencies]
winres = { package = "tauri-winres", version = "0.3" }

[dev-dependencies]
ttf-parser = "0.25"

[profile.release]
opt-level = 2
lto = true
